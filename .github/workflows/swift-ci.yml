name: Swift 6 Build & Test + iOS Device IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          swift --version

      - name: Extract original APK sprites, textures & iOS AppIcon (if fishing181.apk is present)
        run: |
          mkdir -p App/Resources/GameData/Drawables
          if [ -d "data" ]; then
            cp -f data/*.json App/Resources/GameData/ 2>/dev/null || true
          fi
          APK_FILE=$(find . -maxdepth 4 -name "fishing181.apk" | head -n 1 || true)
          if [ -n "$APK_FILE" ] && [ -f "tools/extract_apk_drawables.py" ]; then
            python3 tools/extract_apk_drawables.py "$APK_FILE" App/Resources/GameData
          fi
          echo "Drawables count in App/Resources/GameData/Drawables: $(ls -1 App/Resources/GameData/Drawables 2>/dev/null | wc -l)"
          ls -la App/Resources/Assets.xcassets/AppIcon.appiconset || true

      - name: Fast Fail — Build all Swift targets (FishingCore, FishingDatabase, FishingGameApp)
        run: swift build -v

      - name: Fast Fail — Run unit & integration tests (FishingCoreTests, FishingDatabaseTests, FishingGameAppTests)
        env:
          FISHING_DATA_DIR: ${{ github.workspace }}/data
        run: swift test --parallel

      - name: Generate Xcode project & build iOS Device .ipa (arm64 iPhone / iPad)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

          # Try building directly with the bundled iPhoneOS SDK first (no 8 GB Simulator runtime download!).
          # Only download the iOS platform if Xcode 16.2 explicitly requires it for destination resolution.
          if ! xcodebuild \
            -project FishingIOSApp.xcodeproj \
            -scheme FishingIOSApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build; then
            echo "Direct iphoneos build requested platform components — downloading iOS 18.2 platform..."
            sudo xcodebuild -downloadPlatform iOS -buildVersion 18.2
            xcodebuild \
              -project FishingIOSApp.xcodeproj \
              -scheme FishingIOSApp \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedDataDevice \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build
          fi

          DEVICE_APP_PATH="build/DerivedDataDevice/Build/Products/Release-iphoneos/FishingIOSApp.app"
          ls -la "$DEVICE_APP_PATH"
          ls -la "$DEVICE_APP_PATH/GameData"
          rm -rf build/ipa_stage
          mkdir -p build/ipa_stage/Payload
          cp -R "$DEVICE_APP_PATH" build/ipa_stage/Payload/FishingIOSApp.app
          (cd build/ipa_stage && ditto -c -k --sequesterRsrc --keepParent Payload "${GITHUB_WORKSPACE}/FishingIOSApp-iOS18-Device.ipa")
          ls -lh FishingIOSApp-iOS18-Device.ipa

      - name: Upload FishingIOSApp.ipa Device Artifact (arm64 iPhone/iPad)
        uses: actions/upload-artifact@v4
        with:
          name: FishingIOSApp-iOS18-Device-IPA
          path: FishingIOSApp-iOS18-Device.ipa
          if-no-files-found: error
