
name: iOS 18+ Swift 6 CI (FishingCore & FishingDatabase)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  swift-test-macos:
    name: Build & Test on macOS 15
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build FishingCore and FishingDatabase
        run: swift build -v

      - name: Run Unit Tests
        run: swift test --parallel -v
